<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 268" width="600" height="268" font-family="'IBM Plex Sans KR','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" role="img" aria-label="주문 상태 전이도: CREATED 에서 PLACE 로 PLACING 이 되고, PLACING 에서 COMPLETE 로 COMPLETED, FAIL 로 FAILED 가 된다. 보상이 실패하면 PLACING 에 머물고 워커가 재시도한다. FAILED 에서 다시 PLACE 로 PLACING 으로 돌아가 재결제할 수 있다."><rect x="0" y="0" width="600" height="268" fill="#FFFFFF"/><defs><marker id="sm-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><polygon fill="#5B6B69" points="0,1.5 10,5 0,8.5"/></marker><marker id="sm-g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><polygon fill="#0E6B60" points="0,1.5 10,5 0,8.5"/></marker><marker id="sm-b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><polygon fill="#A65210" points="0,1.5 10,5 0,8.5"/></marker></defs><rect x="16" y="96" width="122" height="44" rx="8" fill="#F4F7F6" stroke="#CFD9D7"/><text x="77" y="116" font-family="'IBM Plex Mono','SFMono-Regular',Menlo,Consolas,monospace" font-size="12.5" font-weight="600" text-anchor="middle" fill="#132220">CREATED</text><text x="77" y="131" font-size="10.5" text-anchor="middle" fill="#5B6B69">주문만 저장됨</text><rect x="222" y="96" width="122" height="44" rx="8" fill="#DCEDEA" stroke="#0E6B60"/><text x="283" y="116" font-family="'IBM Plex Mono','SFMono-Regular',Menlo,Consolas,monospace" font-size="12.5" font-weight="600" text-anchor="middle" fill="#132220">PLACING</text><text x="283" y="131" font-size="10.5" text-anchor="middle" fill="#5B6B69">사가 미결</text><rect x="432" y="26" width="146" height="44" rx="8" fill="#DCEDEA" stroke="#0E6B60"/><text x="505" y="46" font-family="'IBM Plex Mono','SFMono-Regular',Menlo,Consolas,monospace" font-size="12.5" font-weight="600" text-anchor="middle" fill="#132220">COMPLETED</text><text x="505" y="61" font-size="10.5" text-anchor="middle" fill="#5B6B69">결제 완료</text><rect x="432" y="166" width="146" height="44" rx="8" fill="#F5E7D8" stroke="#A65210"/><text x="505" y="186" font-family="'IBM Plex Mono','SFMono-Regular',Menlo,Consolas,monospace" font-size="12.5" font-weight="600" text-anchor="middle" fill="#132220">FAILED</text><text x="505" y="201" font-size="10.5" text-anchor="middle" fill="#5B6B69">보상까지 끝남</text><line x1="138" y1="118" x2="214" y2="118" stroke="#0E6B60" stroke-width="1.5" marker-end="url(#sm-g)"/><text x="176" y="110" font-family="'IBM Plex Mono','SFMono-Regular',Menlo,Consolas,monospace" font-size="10.5" text-anchor="middle" fill="#5B6B69">PLACE</text><path d="M 344 108 L 424 62" fill="none" stroke="#0E6B60" stroke-width="1.5" marker-end="url(#sm-g)"/><text x="368" y="64" font-family="'IBM Plex Mono','SFMono-Regular',Menlo,Consolas,monospace" font-size="10.5" text-anchor="middle" fill="#5B6B69">COMPLETE</text><path d="M 344 128 L 424 174" fill="none" stroke="#A65210" stroke-width="1.5" marker-end="url(#sm-b)"/><text x="370" y="182" font-family="'IBM Plex Mono','SFMono-Regular',Menlo,Consolas,monospace" font-size="10.5" text-anchor="middle" fill="#5B6B69">FAIL</text><path d="M 462 210 C 424 250, 322 246, 290 144" fill="none" stroke="#5B6B69" stroke-width="1.5" marker-end="url(#sm-a)"/><text x="378" y="254" font-family="'IBM Plex Mono','SFMono-Regular',Menlo,Consolas,monospace" font-size="10.5" text-anchor="middle" fill="#5B6B69">PLACE — 재결제</text><path d="M 252 96 C 236 50, 330 50, 314 96" fill="none" stroke="#A65210" stroke-width="1.4" stroke-dasharray="4 4" marker-end="url(#sm-b)"/><text x="283" y="44" font-family="'IBM Plex Mono','SFMono-Regular',Menlo,Consolas,monospace" font-size="10.5" text-anchor="middle" fill="#A65210">보상 재시도 — 워커</text></svg>