<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 902 819" width="902" height="819" font-family="'IBM Plex Sans KR','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" role="img" aria-label="롤백 C 시퀀스: 재고와 포인트가 차감된 뒤 결제가 실패하면 결제 취소, 포인트 환불, 재고 복구를 역순으로 모두 보낸다. 타임아웃으로 생긴 PAID 는 결제 취소가 CANCELED 로 돌린다. 보상이 끝나면 주문을 FAILED 로 바꾸고 409 PAYMENT_FAILED 를 반환한다."><defs><marker id="mk-call-p" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><polygon fill="#0E6B60" points="0,1.5 10,5 0,8.5"/></marker><marker id="mk-ret-p" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><polygon fill="#5B6B69" points="0,1.5 10,5 0,8.5"/></marker><marker id="mk-comp-p" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><polygon fill="#A65210" points="0,1.5 10,5 0,8.5"/></marker><marker id="mk-fail-p" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><polygon fill="#A52B2B" points="0,1.5 10,5 0,8.5"/></marker></defs><rect x="0" y="0" width="902" height="819" fill="#FFFFFF"/><line x1="70" y1="48" x2="70" y2="809" stroke="#CFD9D7" stroke-dasharray="3 5"/><line x1="256" y1="48" x2="256" y2="809" stroke="#CFD9D7" stroke-dasharray="3 5"/><line x1="452" y1="48" x2="452" y2="809" stroke="#CFD9D7" stroke-dasharray="3 5"/><line x1="644" y1="48" x2="644" y2="809" stroke="#CFD9D7" stroke-dasharray="3 5"/><line x1="834" y1="48" x2="834" y2="809" stroke="#CFD9D7" stroke-dasharray="3 5"/><rect x="251" y="70" width="10" height="739" rx="3" fill="#DCEDEA" stroke="#0E6B60" stroke-opacity="0.45"/><rect x="6" y="14" width="128" height="34" rx="7" fill="#F4F7F6" stroke="#CFD9D7"/><text x="70" y="36" font-size="12.5" font-weight="600" text-anchor="middle" fill="#132220">Client</text><rect x="192" y="14" width="128" height="34" rx="7" fill="#DCEDEA" stroke="#0E6B60"/><text x="256" y="36" font-size="12.5" font-weight="600" text-anchor="middle" fill="#132220">Order Server</text><rect x="388" y="14" width="128" height="34" rx="7" fill="#F4F7F6" stroke="#CFD9D7"/><text x="452" y="36" font-size="12.5" font-weight="600" text-anchor="middle" fill="#132220">Product Server</text><rect x="580" y="14" width="128" height="34" rx="7" fill="#F4F7F6" stroke="#CFD9D7"/><text x="644" y="36" font-size="12.5" font-weight="600" text-anchor="middle" fill="#132220">Point Server</text><rect x="770" y="14" width="128" height="34" rx="7" fill="#F4F7F6" stroke="#CFD9D7"/><text x="834" y="36" font-size="12.5" font-weight="600" text-anchor="middle" fill="#132220">Payment Server</text><line x1="76" y1="84" x2="247" y2="84" stroke="#0E6B60" stroke-width="1.6" marker-end="url(#mk-call-p)"/><text x="163" y="76" font-size="11.5" text-anchor="middle" fill="#0E6B60">POST /order/place { orderId }</text><rect x="183" y="132" width="146" height="31" rx="6" fill="#DCEDEA" stroke="#0E6B60" stroke-opacity="0.55"/><text x="256" y="152" font-size="11.5" text-anchor="middle" fill="#132220">CREATED → PLACING</text><line x1="262" y1="189" x2="443" y2="189" stroke="#0E6B60" stroke-width="1.6" marker-end="url(#mk-call-p)"/><text x="354" y="181" font-size="11.5" text-anchor="middle" fill="#0E6B60"><tspan font-weight="700">①</tspan> 재고 차감</text><line x1="446" y1="227" x2="265" y2="227" stroke="#5B6B69" stroke-width="1.3" stroke-dasharray="5 4" marker-end="url(#mk-ret-p)"/><text x="354" y="219" font-size="11.5" text-anchor="middle" fill="#5B6B69">차감 완료</text><line x1="262" y1="265" x2="635" y2="265" stroke="#0E6B60" stroke-width="1.6" marker-end="url(#mk-call-p)"/><text x="450" y="257" font-size="11.5" text-anchor="middle" fill="#0E6B60"><tspan font-weight="700">②</tspan> 포인트 차감</text><line x1="638" y1="303" x2="265" y2="303" stroke="#5B6B69" stroke-width="1.3" stroke-dasharray="5 4" marker-end="url(#mk-ret-p)"/><text x="450" y="295" font-size="11.5" text-anchor="middle" fill="#5B6B69">사용 완료</text><line x1="262" y1="341" x2="825" y2="341" stroke="#0E6B60" stroke-width="1.6" marker-end="url(#mk-call-p)"/><text x="545" y="333" font-size="11.5" text-anchor="middle" fill="#0E6B60"><tspan font-weight="700">③</tspan> 결제  총액</text><line x1="828" y1="379" x2="265" y2="379" stroke="#A52B2B" stroke-width="1.3" stroke-dasharray="5 4" marker-end="url(#mk-fail-p)"/><line x1="812" y1="374" x2="822" y2="384" stroke="#A52B2B" stroke-width="1.8" stroke-linecap="round"/><line x1="822" y1="374" x2="812" y2="384" stroke="#A52B2B" stroke-width="1.8" stroke-linecap="round"/><text x="545" y="371" font-size="11.5" text-anchor="middle" fill="#A52B2B">실패 · 승인 거절 · 타임아웃</text><line x1="10" y1="429" x2="892" y2="429" stroke="#A65210" stroke-opacity="0.45" stroke-dasharray="4 4"/><rect x="10" y="420" width="151" height="18" rx="4" fill="#F5E7D8"/><text x="19" y="433" font-size="11" font-weight="600" letter-spacing="0.5" fill="#A65210">보상 — 세 곳 모두, 역순</text><line x1="262" y1="451" x2="825" y2="451" stroke="#A65210" stroke-width="1.6" marker-end="url(#mk-comp-p)"/><text x="545" y="443" font-size="11.5" text-anchor="middle" fill="#A65210">결제 취소  sagaId</text><line x1="828" y1="489" x2="265" y2="489" stroke="#A65210" stroke-width="1.3" stroke-dasharray="5 4" marker-end="url(#mk-comp-p)"/><text x="545" y="481" font-size="11.5" text-anchor="middle" fill="#A65210">200 · PAID 가 있었으면 CANCELED</text><line x1="262" y1="527" x2="635" y2="527" stroke="#A65210" stroke-width="1.6" marker-end="url(#mk-comp-p)"/><text x="450" y="519" font-size="11.5" text-anchor="middle" fill="#A65210">포인트 환불  sagaId</text><line x1="638" y1="565" x2="265" y2="565" stroke="#A65210" stroke-width="1.3" stroke-dasharray="5 4" marker-end="url(#mk-comp-p)"/><text x="450" y="557" font-size="11.5" text-anchor="middle" fill="#A65210">환불 완료</text><line x1="262" y1="603" x2="443" y2="603" stroke="#A65210" stroke-width="1.6" marker-end="url(#mk-comp-p)"/><text x="354" y="595" font-size="11.5" text-anchor="middle" fill="#A65210">재고 복구  sagaId</text><line x1="446" y1="641" x2="265" y2="641" stroke="#A65210" stroke-width="1.3" stroke-dasharray="5 4" marker-end="url(#mk-comp-p)"/><text x="354" y="633" font-size="11.5" text-anchor="middle" fill="#A65210">복구 완료</text><rect x="78" y="689" width="356" height="46" rx="6" fill="#F5E7D8" stroke="#A65210" stroke-opacity="0.55"/><text x="256" y="709" font-size="11.5" text-anchor="middle" fill="#132220">PLACING → FAILED · 사가 COMPENSATED</text><text x="256" y="724" font-size="11.5" text-anchor="middle" fill="#5B6B69">보상이 실패하면 COMPENSATION_FAILED · 주문은 PLACING</text><line x1="250" y1="761" x2="79" y2="761" stroke="#A52B2B" stroke-width="1.3" stroke-dasharray="5 4" marker-end="url(#mk-fail-p)"/><line x1="234" y1="756" x2="244" y2="766" stroke="#A52B2B" stroke-width="1.8" stroke-linecap="round"/><line x1="244" y1="756" x2="234" y2="766" stroke="#A52B2B" stroke-width="1.8" stroke-linecap="round"/><text x="163" y="753" font-size="11.5" text-anchor="middle" fill="#A52B2B">409 PAYMENT_FAILED</text></svg>