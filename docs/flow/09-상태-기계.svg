<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 902 590" width="902" height="590" font-family="'IBM Plex Sans KR','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" role="img" aria-label="세 상태 기계. Order는 CREATED에서 PLACE로 PLACING이 되고 COMPLETE로 COMPLETED, FAIL로 FAILED가 되며 FAILED에서 PLACE로 다시 PLACING으로 돌아가 재결제한다. OrderSaga는 RUNNING에서 COMPLETE로 SUCCEEDED, COMPENSATE로 COMPENSATING이 되고, COMPENSATING에서 COMPENSATION_DONE으로 COMPENSATED, COMPENSATION_FAIL로 COMPENSATION_FAILED가 되며 거기서 COMPENSATE로 다시 COMPENSATING으로 돌아가는 것이 워커의 재시도 경로다. Payment는 PAID에서 CANCEL로 CANCELED가 된다. product와 point에는 상태 기계가 없다."><defs><marker id="ar-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><polygon fill="#0E6B60" points="0,1.5 10,5 0,8.5"/></marker><marker id="ar-c" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><polygon fill="#A65210" points="0,1.5 10,5 0,8.5"/></marker><marker id="ar-m" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><polygon fill="#5B6B69" points="0,1.5 10,5 0,8.5"/></marker></defs><rect x="0" y="0" width="902" height="590" fill="#FFFFFF"/><text x="24" y="34" font-size="13" font-weight="700" fill="#132220">Order</text><text x="116" y="34" font-size="11" fill="#5B6B69">— 주문이 사가를 한 번에 하나만 돌게 한다</text><rect x="30" y="58" width="118" height="42" rx="8" fill="#F4F7F6" stroke="#CFD9D7"/><text x="89" y="84" font-family="'IBM Plex Mono','SFMono-Regular',Menlo,Consolas,monospace" font-size="12.5" font-weight="600" text-anchor="middle" fill="#132220">CREATED</text><rect x="236" y="58" width="118" height="42" rx="8" fill="#DCEDEA" stroke="#0E6B60"/><text x="295" y="84" font-family="'IBM Plex Mono','SFMono-Regular',Menlo,Consolas,monospace" font-size="12.5" font-weight="600" text-anchor="middle" fill="#132220">PLACING</text><rect x="452" y="24" width="142" height="42" rx="8" fill="#DCEDEA" stroke="#0E6B60"/><text x="523" y="50" font-family="'IBM Plex Mono','SFMono-Regular',Menlo,Consolas,monospace" font-size="12.5" font-weight="600" text-anchor="middle" fill="#132220">COMPLETED</text><rect x="452" y="92" width="118" height="42" rx="8" fill="#F5E7D8" stroke="#A65210"/><text x="511" y="118" font-family="'IBM Plex Mono','SFMono-Regular',Menlo,Consolas,monospace" font-size="12.5" font-weight="600" text-anchor="middle" fill="#132220">FAILED</text><path d="M 148 79 H 232" fill="none" stroke="#0E6B60" stroke-width="1.5" marker-end="url(#ar-a)"/><text x="190" y="71" font-family="'IBM Plex Mono','SFMono-Regular',Menlo,Consolas,monospace" font-size="10.5" text-anchor="middle" fill="#0E6B60">PLACE</text><path d="M 354 70 L 448 48" fill="none" stroke="#0E6B60" stroke-width="1.5" marker-end="url(#ar-a)"/><text x="398" y="44" font-family="'IBM Plex Mono','SFMono-Regular',Menlo,Consolas,monospace" font-size="10.5" text-anchor="middle" fill="#0E6B60">COMPLETE</text><path d="M 354 88 L 448 110" fill="none" stroke="#A65210" stroke-width="1.5" marker-end="url(#ar-c)"/><text x="398" y="128" font-family="'IBM Plex Mono','SFMono-Regular',Menlo,Consolas,monospace" font-size="10.5" text-anchor="middle" fill="#A65210">FAIL</text><path d="M 470 134 C 420 178, 330 172, 295 104" fill="none" stroke="#5B6B69" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#ar-m)"/><text x="384" y="180" font-family="'IBM Plex Mono','SFMono-Regular',Menlo,Consolas,monospace" font-size="10.5" text-anchor="middle" fill="#5B6B69">PLACE — 재결제</text><line x1="24" y1="200" x2="878" y2="200" stroke="#CFD9D7" stroke-dasharray="3 5"/><text x="24" y="230" font-size="13" font-weight="700" fill="#132220">OrderSaga</text><text x="116" y="230" font-size="11" fill="#5B6B69">— 어디까지 성공했고 보상이 끝났는지를 말한다</text><rect x="252" y="248" width="136" height="42" rx="8" fill="#DCEDEA" stroke="#0E6B60"/><text x="320" y="274" font-family="'IBM Plex Mono','SFMono-Regular',Menlo,Consolas,monospace" font-size="12.5" font-weight="600" text-anchor="middle" fill="#132220">SUCCEEDED</text><rect x="30" y="300" width="116" height="42" rx="8" fill="#DCEDEA" stroke="#0E6B60"/><text x="88" y="326" font-family="'IBM Plex Mono','SFMono-Regular',Menlo,Consolas,monospace" font-size="12.5" font-weight="600" text-anchor="middle" fill="#132220">RUNNING</text><rect x="252" y="334" width="152" height="42" rx="8" fill="#F5E7D8" stroke="#A65210"/><text x="328" y="360" font-family="'IBM Plex Mono','SFMono-Regular',Menlo,Consolas,monospace" font-size="12.5" font-weight="600" text-anchor="middle" fill="#132220">COMPENSATING</text><rect x="608" y="334" width="150" height="42" rx="8" fill="#F5E7D8" stroke="#A65210"/><text x="683" y="360" font-family="'IBM Plex Mono','SFMono-Regular',Menlo,Consolas,monospace" font-size="12.5" font-weight="600" text-anchor="middle" fill="#132220">COMPENSATED</text><rect x="240" y="406" width="196" height="42" rx="8" fill="#F5E7D8" stroke="#A65210"/><text x="338" y="432" font-family="'IBM Plex Mono','SFMono-Regular',Menlo,Consolas,monospace" font-size="12.5" font-weight="600" text-anchor="middle" fill="#132220">COMPENSATION_FAILED</text><path d="M 88 298 V 270 H 248" fill="none" stroke="#0E6B60" stroke-width="1.5" marker-end="url(#ar-a)"/><text x="166" y="262" font-family="'IBM Plex Mono','SFMono-Regular',Menlo,Consolas,monospace" font-size="10.5" text-anchor="middle" fill="#0E6B60">COMPLETE</text><path d="M 146 330 L 248 350" fill="none" stroke="#A65210" stroke-width="1.5" marker-end="url(#ar-c)"/><text x="192" y="364" font-family="'IBM Plex Mono','SFMono-Regular',Menlo,Consolas,monospace" font-size="10.5" text-anchor="middle" fill="#A65210">COMPENSATE</text><path d="M 404 355 H 604" fill="none" stroke="#A65210" stroke-width="1.5" marker-end="url(#ar-c)"/><text x="504" y="345" font-family="'IBM Plex Mono','SFMono-Regular',Menlo,Consolas,monospace" font-size="10.5" text-anchor="middle" fill="#A65210">COMPENSATION_DONE</text><path d="M 306 376 V 402" fill="none" stroke="#A65210" stroke-width="1.5" marker-end="url(#ar-c)"/><text x="296" y="396" font-family="'IBM Plex Mono','SFMono-Regular',Menlo,Consolas,monospace" font-size="10.5" text-anchor="end" fill="#A65210">COMPENSATION_FAIL</text><path d="M 362 402 V 380" fill="none" stroke="#5B6B69" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#ar-m)"/><text x="374" y="396" font-family="'IBM Plex Mono','SFMono-Regular',Menlo,Consolas,monospace" font-size="10.5" text-anchor="start" fill="#5B6B69">COMPENSATE — 워커 재시도</text><line x1="24" y1="470" x2="878" y2="470" stroke="#CFD9D7" stroke-dasharray="3 5"/><text x="24" y="500" font-size="13" font-weight="700" fill="#132220">Payment</text><text x="116" y="500" font-size="11" fill="#5B6B69">— 결제 기록의 생사만 표시한다</text><rect x="30" y="524" width="116" height="42" rx="8" fill="#DCEDEA" stroke="#0E6B60"/><text x="88" y="550" font-family="'IBM Plex Mono','SFMono-Regular',Menlo,Consolas,monospace" font-size="12.5" font-weight="600" text-anchor="middle" fill="#132220">PAID</text><rect x="252" y="524" width="136" height="42" rx="8" fill="#F5E7D8" stroke="#A65210"/><text x="320" y="550" font-family="'IBM Plex Mono','SFMono-Regular',Menlo,Consolas,monospace" font-size="12.5" font-weight="600" text-anchor="middle" fill="#132220">CANCELED</text><path d="M 146 545 H 248" fill="none" stroke="#A65210" stroke-width="1.5" marker-end="url(#ar-c)"/><text x="197" y="537" font-family="'IBM Plex Mono','SFMono-Regular',Menlo,Consolas,monospace" font-size="10.5" text-anchor="middle" fill="#A65210">CANCEL</text><text x="424" y="539" font-size="11.5" fill="#5B6B69">product · point에는 상태 기계가 없다.</text><text x="424" y="557" font-size="11.5" fill="#5B6B69">*TransactionType은 이력 행의 불변 종류라 전이가 아니다.</text></svg>