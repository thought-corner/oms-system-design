syntax = "proto3";

package msa.saga.v1;

option java_multiple_files = true;
option java_package = "com.project.message.payment";

message StockBuyCommand {
  message Item {
    int64 product_id = 1;
    int64 quantity = 2;
  }
  string saga_id = 1;
  int64 order_id = 2;
  repeated Item items = 3;
}
